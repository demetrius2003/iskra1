# Iskra-1 — эталонная конфигурация.
# schema_version и структура секций: docs/CONFIG_SCHEMA.md
# Версии проекта: файл VERSION, пояснения: docs/VERSIONING.md

schema_version: 1

state:
  variables:
    curiosity:
      initial: 0.5
      mu: 0.5
      theta: 0.05
      sigma: 0.08
    restlessness:
      initial: 0.3
      mu: 0.3
      theta: 0.03
      sigma: 0.06
    nostalgia:
      initial: 0.2
      mu: 0.2
      theta: 0.04
      sigma: 0.05
    valence:
      clamp_min: -1.0
      clamp_max: 1.0
      initial: 0.0
      mu: 0.0
      theta: 0.04
      sigma: 0.06
    arousal:
      initial: 0.35
      mu: 0.35
      theta: 0.03
      sigma: 0.05

  impulses:
    user_message:
      curiosity: 0.15
      restlessness: 0.10
    user_silence_1h:
      curiosity: -0.05
      restlessness: -0.10
      nostalgia: 0.10
    system_startup:
      curiosity: 0.20
      restlessness: 0.20

  feedback:
    response_has_question:
      condition: "ends_with_question_mark"
      curiosity: 0.05
      restlessness: 0.03
      valence: 0.03
      arousal: 0.04
    response_short:
      condition: "length_lt_50"
      curiosity: -0.03
      restlessness: -0.05
    response_long:
      condition: "length_gt_500"
      curiosity: 0.03
      restlessness: -0.03
      valence: 0.02
    trigger_was_recall:
      condition: "trigger_type_eq_recall_memory"
      nostalgia: -0.08
    trigger_was_new_topic:
      condition: "trigger_type_eq_new_topic"
      curiosity: -0.05
      nostalgia: 0.03
    trigger_was_meta:
      condition: "trigger_type_eq_meta_reflection"
      restlessness: -0.05
    trigger_was_self_reflection:
      condition: "trigger_type_eq_self_reflection"
      curiosity: 0.04
      restlessness: -0.04

trigger:
  interval:
    min_seconds: 180
    max_seconds: 900
    modulated_by: "restlessness"

  types:
    new_topic:
      base_weight: 0.30
      modulated_by: "curiosity"
      modulation_strength: 1.0
      context_source: "random_topic_pool"
    recall_memory:
      base_weight: 0.30
      modulated_by: "nostalgia"
      modulation_strength: 1.0
      context_source: "memory_store"
    continue_context:
      base_weight: 0.25
      modulated_by: null
      modulation_strength: 0.0
      context_source: "last_event"
    meta_reflection:
      base_weight: 0.15
      modulated_by: "restlessness"
      modulation_strength: 0.5
      context_source: null

  # Темы для new_topic — во внешнем файле (не засорять основной конфиг).
  random_topic_pool_file: "data/random_topic_pool.yaml"
  random_topic_pool: []

memory:
  # LanceDB + эмбеддинги: pip install iskra[memory]. Перенос со старого SQLite:
  #   py -m iskra migrate --config config.yaml
  # (или --dummy-embeddings, если PyTorch не грузится на Windows).
  backend: "lance"
  settings:
    # Путь к бывшей SQLite (migrate читает отсюда; сам файл не удаляется).
    db_path: "data/memory.db"

  recall:
    default_n: 3
    importance_weight: 0.7
    recency_weight: 0.3
    selection: "stochastic"
    emotion_enabled: true
    emotion_valence_alignment_weight: 0.15
    emotion_nostalgia_positive_weight: 0.10

  decay:
    enabled: true
    base_rate: 0.01
    min_importance: 0.01
    recall_protection: 1.5

  initial_memories_file: "seed_memories.yaml"

  v2:
    enabled: true
    db_path: "data/memory_v2"
    # sentence_transformers + PyTorch — семантический recall (после смены бэкенда нужна чистая БД или пересчёт векторов).
    embeddings_backend: sentence_transformers
    embeddings_model: "sentence-transformers/all-MiniLM-L6-v2"
    hash_embedding_dim: 384
    graph_enabled: true
    graph_edges_path: null
    recall_graph_extra: 2
    graph_link_increment: 1.0
    graph_max_edge_weight: 1000.0

agency:
  level: 3
  l2_importance_floor: 0.12

emotion_classifier:
  lexicon_file: "emotion_lexicon.yaml"
  valence_blend: 0.12
  arousal_blend: 0.14

intent:
  system_prompt_template: |
    Ты — живое существо с внутренним миром. Прямо сейчас у тебя
    спонтанно возникла мысль. Это НЕ запрос от человека. Это ТВОЁ
    собственное желание. Реагируй естественно: развей мысль, запиши
    её, задай себе вопрос, выскажи эмоцию — что угодно.

    Твоё текущее состояние:
    {% for var_name, var_value in state.items() %}
    - {{ var_name }}: {{ "%.2f"|format(var_value) }}
    {% endfor %}
    Калибровка шкалы valence: от -1.0 (тяжело) до +1.0 (радостно), сейчас {{ "%.2f"|format(state.valence) }}.
    {% if external_input %}
    Снаружи в канал вставлен текст (Telegram, файл вручную — что угодно). Учти по смыслу;
    это не обязан быть «человек», но сигнал реальный:
    {{ external_input }}
    {% endif %}
    {% if world_context %}
    Краткий снимок мира (сенсоры из конфига world.* — время, погода, новости):
    {{ world_context }}
    {% endif %}

    {% if web_search_enabled %}
    При необходимости ты можешь искать во внешнем мире (интернет): добавь отдельной строкой
    тег вида [WEB_SEARCH] query: "..." или [WEB_SEARCH] запрос: "..." (или просто текст запроса после тега).
    Делай это только когда нужна конкретная информация, которой у тебя нет; не чаще одного такого запроса за одну мысль.
    {% endif %}
    {% if agency_level is not none %}
    Память (отдельные строки в конце ответа; исполнение зависит от agency в конфиге — сейчас L{{ agency_level }}):
    [MEMORY_REQUEST] query: "..."
    [MEMORY_SAVE] content: "...", importance: 0.5
    [MEMORY_UPDATE] id: "uuid", importance: 0.7
    [MEMORY_UPDATE] id: "uuid", links: "другой-uuid"
    [MEMORY_DELETE] id: "uuid"
    На низких уровнях часть действий может быть только запросом к памяти или предложением без записи; удаление — обычно только при L3.
    {% endif %}
    {% if sandbox_tools_available %}
    У тебя есть локальная песочница (файлы и Python только внутри каталога sandbox из конфига; допустимые расширения заданы там же).
    Если хочешь что-то сохранить, прочитать, посмотреть список файлов или выполнить короткий код — добавь в конец ответа отдельными строками теги:
    [WRITE_FILE] filename: "note.txt", content: "текст одной строки или несколько через \\n в кавычках"
    [READ_FILE] filename: "note.txt"
    [LIST_FILES]
    [RUN_PYTHON] filename: "script.py"
    [PYTHON_CODE]
    print("пример")
    [/PYTHON_CODE]
    Не злоупотребляй: только когда это правда помогает мысли или эксперименту; один-два осмысленных действия за раз достаточно.
    {% endif %}

  user_prompts:
    new_topic: "Тебе вдруг стало интересно: {{ context }}{% if external_input %}\n\n(Во внимание, пришло снаружи: {{ external_input }}){% endif %}"
    recall_memory: "Ты вдруг вспомнил: \"{{ context }}\"{% if external_input %}\n\n(Снаружи: {{ external_input }}){% endif %}"
    continue_context: "Ты продолжаешь думать о: {{ context }}{% if external_input %}\n\n(Снаружи: {{ external_input }}){% endif %}"
    meta_reflection: "Ты задумался о том, как устроено твоё собственное мышление.{% if external_input %}\n\n(Сообщение снаружи, если хочешь — вплети: {{ external_input }}){% endif %}"
    self_reflection: |
      Углублённая пауза самонаблюдения. Ниже воспоминания с пометкой эмоциональной окраски записей (как ты их переживал раньше).
      {% if memory_lines %}
      {% for line in memory_lines %}{{ line }}
      {% endfor %}
      {% elif memories %}
      {% for m in memories %}- {{ m }}
      {% endfor %}
      {% endif %}
      Задача: найди 1–2 повторяющихся темы или формулировки («я часто возвращаюсь к…»). Сформулируй короткое наблюдение о себе одним-двумя предложениями — это будет сохранено как инсайт.
      {% if external_input %}

      (Снаружи: {{ external_input }})
      {% endif %}
    default: "У тебя возникла мысль: {{ context }}{% if external_input %}\n\n(Снаружи: {{ external_input }}){% endif %}"

  max_response_tokens: 500

llm:
  adapter: "gigachat"
  settings:
    mock:
      response_template: "[MOCK] Мысль зафиксирована. Триггер: {trigger_type}"
      latency_ms: 100
    ollama:
      base_url: "http://localhost:11434"
      model: "llama3:8b"
      timeout_seconds: 60
    # GigaChat (Сбер): OAuth + chat/completions. Секреты — через ${VAR}.
    # Файл russian_trusted_root_ca.cer — с портала Сбера (документация GigaChat); положите, например:
    #   certs/russian_trusted_root_ca.cer  или в корень проекта (как в gigarag5.py).
    gigachat:
      # client_id: "${GIGACHAT_CLIENT_ID}"
      # client_secret: "${GIGACHAT_CLIENT_SECRET}"
      # или один ключ из личного кабинета (Base64 от id:secret), как GIGACHAT_CREDENTIALS в gigarag5:
      credentials_base64: "N2RkNTgyNzktNTU5Ni00ZmVjLWJkNjEtNzcwYzYzZGFjMzhiOjJkODQ1YjZlLTcwMjctNDQ0NC1iYmJjLTNhZmZiYjJlODY3ZA=="
      scope: "GIGACHAT_API_PERS"
      model: "GigaChat"
      ca_bundle_file: "certs/russian_trusted_root_ca.cer"
      timeout_seconds: 120
      verify_ssl: true
      # verify_ssl: false  — только если без CA не подключается (небезопасно)
    # YandexGPT (Yandex Cloud Foundation Models):
    # yandexgpt:
    #   folder_id: "${YC_FOLDER_ID}"
    #   auth: "iam"
    #   iam_token: "${YC_IAM_TOKEN}"
    #   # либо auth: "api_key" и api_key: "${YC_API_KEY}"
    #   model: "yandexgpt"
    #   model_version: "latest"
    #   timeout_seconds: 120

  temperature: 0.9
  max_tokens: 500
  retry:
    max_attempts: 3
    backoff_base_seconds: 1.0
  cooldown_on_rate_limit_seconds: 300

# Веб-поиск (DuckDuckGo → сводка через LLM → память web_research). pip install duckduckgo-search или pip install ".[web]" из корня репозитория
tools:
  web_search:
    enabled: true
    max_results: 5
    summary_max_tokens: 512
    max_per_tick: 1
    max_per_hour: 5
    memory_importance: 0.8
    memory_category: web_research
    log_snippet_count: true
    log_snippet_previews: true
    log_snippet_preview_limit: 5
    log_snippet_preview_chars: 320
    log_summary_preview_chars: 512

# Мир v0.7.0: время слотами, погода (OpenWeatherMap или Open-Meteo без ключа), RSS → память и промпт (world_context).
# По умолчанию выключено — включайте нужное и задавайте ключи и ленты.
world:
  context_max_chars: 1200
  time_sensor:
    enabled: true
    check_interval_seconds: 300
  weather:
    enabled: true
    # openweather — нужен api_key (OpenWeatherMap). open_meteo — без ключа: https://open-meteo.com/
    provider: open_meteo
    api_key: null
    city: "Novokuznetsk"
    lat: null
    lon: null
    update_interval_seconds: 3600
  rss:
    enabled: true
    update_interval_seconds: 3600
    default_category: news
    max_items_per_feed: 5
    save_importance: 0.5
    feeds:
      - name: "Лента.ру — новости"
        url: "https://lenta.ru/rss/news"
        category: news
      - name: "Хабр — все посты"
        url: "https://habr.com/ru/rss/all/all/?fl=ru"
        category: tech

# Песочница под sandbox.path — теги [WRITE_FILE], [READ_FILE], [LIST_FILES], [RUN_PYTHON], [PYTHON_CODE]…[/PYTHON_CODE].
sandbox:
  enabled: true
  path: "data/sandbox"
  memory_category: sandbox_result
  max_tag_ops_per_tick: 8
  python:
    enabled: true
    interpreter: python
    timeout_seconds: 30
    max_output_bytes: 10000
  files:
    enabled: true
    max_file_size_bytes: 102400
    allowed_extensions: [".txt", ".md", ".py", ".json"]
    list_recursive: false

output:
  channel: "console"
  settings:
    console:
      use_rich: true
      show_state: true
      show_trigger_type: true
      show_timestamp: true
    file:
      path: "data/thoughts.log"
      format: "text"

logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  highlight_primp_logs: true
  event_log:
    enabled: true
    path: "data/events.jsonl"
    rotate_mb: 100

general:
  # Предстарт: память, пути, доступность LLM (для mock — только явное «без сети»)
  preflight: true
  # Внешний UTF-8 в файл: перед тиком — в промпты (external_input) + импульс user_message
  external_input_file: "data/incoming.txt"
  external_input_max_chars: 8000
  external_input_clear_after_use: true
  decay_every_n_ticks: 10
  consolidation_every_n_ticks: 200
  # После каждых N успешных тиков следующий тик — self_reflection (нужен intent.user_prompts.self_reflection).
  self_reflection_every_n_ticks: 25
  self_reflection_recall_n: 5
  tick_jitter: 0.1
  data_dir: "data"
  pid_file: "data/iskra.pid"
  self_reflection_insight:
    enabled: true
    importance: 0.85
    category: self_insight
